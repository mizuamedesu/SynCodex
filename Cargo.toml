[package]
name = "syncodex"
version = "0.2.2"
edition = "2024"
description = "Back up, restore and rewind Codex conversation history"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
fs2 = "0.4.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
ratatui-textarea = "0.9.3"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
zstd = "0.14.0"
